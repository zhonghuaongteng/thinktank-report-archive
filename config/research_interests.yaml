# 个人研究关注层：实质相关且质量合格时提高精读、选用与展示优先级；不按词面自动升P0/P1。
# 关注议题不是整期主线或逐篇分析框架；各篇按报告自身内容展开，不缩小来源或日期范围。
# 依据独立研究项目、问题主线与近期明确要求；不宣称全库精确词频，不按重复文件计权。
# 这是可持续维护的起点，不是封闭目录。每周模型按 docs/keyword_evolution.md 核准后更新；新主题先标“探索观察”。
# aliases 参与词面匹配；questions/boundary 供模型语义判断，程序不据其自动推理或升优先级。
version: 1
updated: '2026-09-23'
interests:
  - name: 企业基础研究
    level: 明确重点
    questions:
      - 企业为什么开展或放弃基础研究，如何把真实需求转化为持续投入？
      - 长周期、高不确定性研究怎样组织、资助、合作、评价，并形成企业能力？
    aliases:
      - 企业基础研究
      - 企业开展基础研究
      - corporate basic research
      - business basic research
      - industrial basic research
      - corporate science
      - basic research in firms
      - basic research by firms
      - corporate research laboratories
      - corporate research labs
      - 企业科研组织
    boundary: 企业研发总量、专利或论文数量不能单独证明基础研究投入、动机或能力。
  - name: AI4S与科学研究变革
    level: 明确重点
    questions:
      - AI如何改变科学问题、发现过程、实验闭环及科学路线，而不只提高通用办公效率？
      - AI原生设施、科学数据、算力、科研组织和开放治理如何共同支撑新研究方式？
    aliases:
      - AI4S
      - AI4Science
      - AI for Science
      - AI for scientific discovery
      - artificial intelligence for science
      - AI-enabled science
      - AI-driven science
      - AI-driven scientific discovery
      - scientific foundation models
      - foundation models for science
      - self-driving laboratory
      - self-driving laboratories
      - self-driving labs
      - autonomous laboratories
      - AI-ready data
      - 科学智能
      - 人工智能驱动科学
      - 自主实验室
      - 自动化实验室
      - 科学基础模型
    boundary: 普通AI产业或实验室新闻不因含AI、科学、实验室就视为AI4S机制证据。
  - name: 区块链与可信协作
    level: 明确重点
    questions:
      - 协议机制、验证成本与治理如何影响跨主体协作和实际采用？
      - 区块链如何进入科学、产业数据、数字资产、支付与智能体协作，有哪些可验证成效和障碍？
    aliases:
      - 区块链
      - blockchain
      - distributed ledger
      - smart contracts
      - zero-knowledge proof
      - zero knowledge proof
      - 零知识证明
      - Web3
      - decentralized science
      - DeSci
      - 去中心化科学
      - tokenization
      - tokenisation
      - real-world assets
      - 稳定币
      - stablecoin
      - stablecoins
      - programmable payments
      - 可编程支付
    boundary: 金融行情、营销与投机不自动获得研究优先级；RWA、可信数据等须核实其实际机制。
  - name: 科研资助、科学慈善与长期资本
